<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="img/InsertVLogopng.png">
    <link rel="stylesheet" href="styleloginEmpresa.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@6.0.0-alpha.1/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-B/GM4XqrwHnWXNOWMbloTmrYXZg10cakYGmpfsR/bbzQ6JAJI4ihuyADKLnBgrCe" crossorigin="anonymous">
    <title>Login</title>
</head>

<body>
    <section class="principal">
        <div class="background">
            <div class="card">
                <h2>Login</h2>
                <form action="#" method="get" class="form">
                    <label for="email">Email:</label>
                    <input type="email" name="email" id="email" placeholder="Digite seu email corporativo..." required>

                    <label for="senha">Senha:</label>
                    <input type="password" name="senha" id="senha" placeholder="Digite sua senha" required>
                    <a href="#" class="senha-esquecida">Esqueceu sua senha?</a>
                    <button type="submit" class="btn-solid theme-primary bt-entrar">Entrar</button>
                </form>
                <p class="p-cadastro">Não tem uma conta?</p>
                <p class="link-cadastro"><a href="#">Cadastre-se</a></p>
            </div>
        </div>
        <div class="div-img">
        </div>

    </section>
    <script type="module" src="https://cdn.jsdelivr.net/npm/bootstrap@6.0.0-alpha.1/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-1a/pXj49ZQ1aHEmrJ+gMw1otqoVsYwlEnlD8mIfY2TV03r20Y0CN7uqx1tQogjPL"
        crossorigin="anonymous"></script>
</body>

</html>
